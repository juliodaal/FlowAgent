# FlowAgent — local orchestration.
#
# Phase 0: only n8n is enabled. The backend and web services are added in
# Phase 1 and Phase 5 respectively. Supabase runs in the cloud (free tier)
# so it is not started here.
#
# Usage:
#   docker compose up -d n8n
#   open http://localhost:5678 (basic-auth credentials from .env)

services:
  n8n:
    image: n8nio/n8n:1.69.2
    container_name: flowagent-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:?Set N8N_BASIC_AUTH_PASSWORD in .env}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=UTC
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
    volumes:
      - ./n8n/data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

